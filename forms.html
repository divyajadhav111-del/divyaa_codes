<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>forms demo</title>
</head>

<body>
    <h1>forms</h1>
    <p>
    <form action="">
        <h2>RESGISTRATION FORM</h2>
        </p>
        <p>
            <label for="name">enter username</label>
            <input type="text" id="name" placeholder="username" background-color="red">
        </p>
        <p>
            <label for="number">enter your number </label>
            <input type="number" id="number" placeholder="number">
        </p>
        <p>
            <label for="password">enter password </label>
            <input type="password" id="password" placeholder="pass">
        </p>
        <p>
            <button>Previous</button>
            <button>submit</button>
            <input type="submit">
            <button>next</button>

            <h2>Are you graduate</h2>
            <label for="yes">yes</label>
            <input type="radio" id="yes" name="yes" value="yes"><br>

            <label for="no">no</label>
            <input type="radio" id="no" name="yes" value="no"><br>
            <button>submit</button>

            <input type="checkbox" name="agree" id="agree">
            <label for="agree">i agree everything</label>
            <br>
            <h3>search google</h3>
            <form action="https://www.google.com/">
                <input type="text" name="q">
                <button>search Google</button>
            </form>
            <p>
                <h3>search youtube</h3>
                <form action="https://www.youtube.com/">
                    <input type="text" name="search_query">
                    <button>search Youtube</button>
                    <p>
                        <label for="food">please select an enter</label>
                        <select name="food" id="food">
                            <option value="veg">vegetable</option>
                            <option value="fish">fish</option>
                            <option value="chicken">chicken</option>
                        </select>
                        <button>submit</button>
                        </p>
                        <p>
                            <label for="speed">arrange speed:</label>
                            <input type="range" name="range" id="range" min="1.5" max="10"><!---step="2"use for odd number range--->
                        </p>
                        <p>
                            <label for="request">write any query!</label>
                            <br>
                            <textarea id="request" rows="5" cols="40" name="request" placeholder="type here!!!"></textarea>
                            <br>
                            
                            <button>submit</button>
                        </p>
                    </form>
                </p>    
    </form>

</body>

</html>
